<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6F4F1"/>
      <stop offset="1" stop-color="#CFEBE6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F8A9E"/>
      <stop offset="1" stop-color="#0E3B5C"/>
    </linearGradient>
    <radialGradient id="nAtom" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#6FB3E8"/>
      <stop offset="1" stop-color="#2F6FB5"/>
    </radialGradient>
    <radialGradient id="oAtom" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FF9E85"/>
      <stop offset="1" stop-color="#E4574B"/>
    </radialGradient>
    <clipPath id="badge"><circle cx="256" cy="256" r="240"/></clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- sea -->
    <path d="M0 330 C 60 300, 110 300, 170 330 S 280 360, 340 330 S 450 300, 512 330 V512 H0Z" fill="url(#sea)"/>
    <path d="M0 360 C 70 335, 120 340, 180 362 S 300 390, 360 362 S 460 335, 512 358" fill="none" stroke="#7FD1D9" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <path d="M0 410 C 80 390, 140 395, 200 412 S 320 440, 390 412 S 480 392, 512 405" fill="none" stroke="#7FD1D9" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    <!-- little rising bubbles -->
    <circle cx="96" cy="296" r="9" fill="#fff" opacity="0.85"/>
    <circle cx="82" cy="258" r="6" fill="#fff" opacity="0.7"/>
    <circle cx="420" cy="300" r="8" fill="#fff" opacity="0.8"/>
    <circle cx="438" cy="266" r="5" fill="#fff" opacity="0.65"/>
  </g>


  <!-- N2O molecule: N=N=O, tilted, bobbing on the surface -->
  <g transform="translate(0 22) rotate(-18 256 215)">
    <rect x="150" y="205" width="212" height="20" rx="10" fill="#0E3B5C"/>
    <circle cx="160" cy="215" r="52" fill="url(#nAtom)" stroke="#0E3B5C" stroke-width="8"/>
    <circle cx="256" cy="215" r="52" fill="url(#nAtom)" stroke="#0E3B5C" stroke-width="8"/>
    <circle cx="356" cy="215" r="58" fill="url(#oAtom)" stroke="#0E3B5C" stroke-width="8"/>
    <!-- shine -->
    <ellipse cx="142" cy="193" rx="14" ry="9" fill="#fff" opacity="0.6"/>
    <ellipse cx="238" cy="193" rx="14" ry="9" fill="#fff" opacity="0.6"/>
    <ellipse cx="336" cy="190" rx="16" ry="10" fill="#fff" opacity="0.6"/>
    <!-- cute face on the O -->
    <circle cx="340" cy="220" r="7" fill="#0E3B5C"/>
    <circle cx="374" cy="220" r="7" fill="#0E3B5C"/>
    <path d="M345 238 Q357 250 369 238" fill="none" stroke="#0E3B5C" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="330" cy="238" rx="8" ry="5" fill="#FF6F7D" opacity="0.6"/>
    <ellipse cx="384" cy="238" rx="8" ry="5" fill="#FF6F7D" opacity="0.6"/>
    <!-- N labels -->
    <text x="160" y="232" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="48" fill="#fff" text-anchor="middle">N</text>
    <text x="256" y="232" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="48" fill="#fff" text-anchor="middle">N</text>
  </g>

  <circle cx="256" cy="256" r="240" fill="none" stroke="#0E3B5C" stroke-width="16"/>
</svg>
